<!DOCTYPE html>
<html lang="en">
 <head>
  <meta charset="utf-8"/>
  <meta content="width=device-width,initial-scale=1" name="viewport"/>
  <title>
   News | Global Era RP
  </title>
  <link href="styles.css" rel="stylesheet"/>
 </head>
 <body>
  <div id="site-header">
  </div>
  <main class="page-wrap">
   <section class="page-hero">
    <span class="eyebrow">
     FROM THE DEVELOPMENT TEAM
    </span>
    <h1>
     Signals from
     <span>
      the world.
     </span>
    </h1>
    <p>
     Development notes and announcements from Global Era Roleplay.
    </p>
   </section>
   <div class="toolbar">
    <span class="eyebrow">
     LATEST UPDATES
    </span>
    <button class="btn btn-ghost small" id="refresh-news">
     Refresh
    </button>
   </div>
   <section class="news-list" id="news-list">
    <article class="news-item">
     <span class="tag">
      WELCOME
     </span>
     <h2>
      Welcome to Global Era RP
     </h2>
     <p>
      Our website is being prepared. Follow the community for confirmed play-test and launch updates.
     </p>
     <small>
      Starter announcement &middot; Sample content
     </small>
    </article>
   </section>
   <p class="fine-print" id="news-status" role="status">
   </p>
  </main>
  <div id="site-footer">
  </div>
  <script src="js/app.js" type="module">
  </script>
 </body>
</html>
